<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sargas Foundry Catalog</title>
  <meta name="description" content="Modules and game systems for Foundry VTT by Diego Vescovini (sargas79), with manifest links and latest versions.">
  <style>
    :root {
      --bg: #f6f3ee;
      --surface: #ffffff;
      --text: #22201c;
      --muted: #6b665d;
      --border: #e2ddd4;
      --accent: #8a3b12;
      --accent-soft: #f4e6dc;
      --code-bg: #f0ece5;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #17151a; --surface: #211e24; --text: #ece7df; --muted: #a39d92;
        --border: #35303a; --accent: #e9a06c; --accent-soft: #3a2a22; --code-bg: #2a262e;
      }
    }
    :root[data-theme="dark"] {
      --bg: #17151a; --surface: #211e24; --text: #ece7df; --muted: #a39d92;
      --border: #35303a; --accent: #e9a06c; --accent-soft: #3a2a22; --code-bg: #2a262e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; }
    header h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: -0.01em; }
    header p { margin: 0; color: var(--muted); }
    header .meta { font-size: 0.875rem; margin-top: 8px; }
    section { margin-top: 40px; }
    h2 { font-size: 1.25rem; margin: 0 0 12px; display: flex; align-items: baseline; gap: 10px; }
    h2 .count { font-size: 0.85rem; font-weight: normal; color: var(--muted); }
    .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 16px; display: flex; flex-direction: column; gap: 8px;
    }
    .card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card h3 { margin: 0; font-size: 1.05rem; }
    .card h3 a { color: inherit; text-decoration: none; }
    .card h3 a:hover { text-decoration: underline; }
    .version {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem;
      background: var(--accent-soft); color: var(--accent); border-radius: 999px;
      padding: 2px 10px; white-space: nowrap;
    }
    .summary { margin: 0; color: var(--muted); font-size: 0.95rem; flex: 1; }
    .compat { font-size: 0.8rem; color: var(--muted); }
    .manifest { display: flex; gap: 6px; align-items: center; }
    .manifest input {
      flex: 1; min-width: 0; font: 0.78rem ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--code-bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 8px;
    }
    .manifest button, .manifest a {
      font-size: 0.8rem; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); cursor: pointer; text-decoration: none; white-space: nowrap;
    }
    .manifest button:hover, .manifest a:hover { border-color: var(--accent); color: var(--accent); }
    .empty { color: var(--muted); font-style: italic; }
    footer { margin-top: 48px; font-size: 0.85rem; color: var(--muted); }
    footer a, header a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Sargas Foundry Catalog</h1>
      <p>Modules and game systems for <a href="https://foundryvtt.com">Foundry VTT</a> by
        <a href="https://github.com/sargas79">Diego Vescovini</a>. Paste a manifest URL into
        Foundry's <em>Install Module</em> or <em>Install System</em> dialog.</p>
      <p class="meta" id="generated"></p>
    </header>

    <section>
      <h2>Systems <span class="count" id="systems-count"></span></h2>
      <div class="grid" id="systems"></div>
    </section>

    <section>
      <h2>Modules <span class="count" id="modules-count"></span></h2>
      <div class="grid" id="modules"></div>
    </section>

    <footer>
      Versions come from each repository's latest GitHub release and are refreshed daily.
      Source: <a href="https://github.com/sargas79/sargas-foundry-catalog">sargas-foundry-catalog</a>.
    </footer>
  </main>

  <script>
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function compatText(c) {
      if (!c) return "";
      const parts = [];
      if (c.minimum) parts.push(`Foundry ${esc(c.minimum)}+`);
      if (c.verified) parts.push(`verified ${esc(c.verified)}`);
      return parts.join(" · ");
    }

    function card(item) {
      const version = item.version ? `v${esc(item.version)}` : "no release";
      return `
        <article class="card">
          <div class="top">
            <h3><a href="${esc(item.repo)}">${esc(item.name)}</a></h3>
            <span class="version" title="Latest release">${version}</span>
          </div>
          <p class="summary">${esc(item.summary)}</p>
          <div class="compat">${compatText(item.compatibility)}</div>
          <div class="manifest">
            <input type="text" readonly value="${esc(item.manifest)}" aria-label="Manifest URL for ${esc(item.name)}">
            <button type="button" data-copy="${esc(item.manifest)}">Copy</button>
            <a href="${esc(item.manifest)}">Open</a>
          </div>
        </article>`;
    }

    function render(list, id) {
      const el = document.getElementById(id);
      document.getElementById(`${id}-count`).textContent = list.length ? `(${list.length})` : "";
      el.innerHTML = list.length ? list.map(card).join("") : `<p class="empty">Nothing listed yet.</p>`;
    }

    document.addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-copy]");
      if (!btn) return;
      try {
        await navigator.clipboard.writeText(btn.dataset.copy);
        const old = btn.textContent; btn.textContent = "Copied"; setTimeout(() => (btn.textContent = old), 1200);
      } catch {
        btn.previousElementSibling.select();
      }
    });

    fetch("data.json", { cache: "no-cache" })
      .then((r) => r.json())
      .then((data) => {
        render(data.systems ?? [], "systems");
        render(data.modules ?? [], "modules");
        if (data.generatedAt) {
          document.getElementById("generated").textContent =
            `Last refreshed ${new Date(data.generatedAt).toLocaleString()}`;
        }
      })
      .catch(() => {
        document.getElementById("generated").textContent = "Could not load data.json.";
      });
  </script>
</body>
</html>
